<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пост — Социальная сеть</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><a href="/">Социальная сеть</a></h1>
            <nav>
                {% include 'partials/nav.html' %}
            </nav>
        </header>
        <main>
            <h2>Новый пост</h2>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <form method="post" action="/posts/create" class="auth-form">
                {% include 'partials/csrf_field.html' %}
                <div>
                    <label for="title">Заголовок</label>
                    <input id="title" name="title" type="text" required maxlength="100"
                        value="{{ title or '' }}">
                </div>
                <div>
                    <label for="content">Текст</label>
                    <textarea id="content" name="content" rows="10" required maxlength="50000">{{ content or '' }}</textarea>
                </div>
                <button type="submit">Опубликовать</button>
            </form>
        </main>
        <footer>
            <p><a href="/">← На главную</a></p>
        </footer>
    </div>
</body>

</html>
