<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Социальная сеть</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1><a href="/">Социальная сеть</a></h1>
            <nav>
                {% include 'partials/nav.html' %}
            </nav>
        </header>
        <main>
            <h2>Регистрация</h2>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <form method="post" action="/register" class="auth-form">
                {% include 'partials/csrf_field.html' %}
                <div>
                    <label for="username">Имя пользователя (буквы, цифры, _)</label>
                    <input id="username" name="username" type="text" required minlength="3" maxlength="50"
                        autocomplete="username">
                </div>
                <div>
                    <label for="password">Пароль (минимум 8 символов)</label>
                    <input id="password" name="password" type="password" required minlength="8" maxlength="128"
                        autocomplete="new-password">
                </div>
                <div>
                    <label for="password2">Пароль ещё раз</label>
                    <input id="password2" name="password2" type="password" required autocomplete="new-password">
                </div>
                <button type="submit">Создать аккаунт</button>
            </form>
        </main>
        <footer>
            <p><a href="/">← На главную</a></p>
        </footer>
    </div>
</body>

</html>
